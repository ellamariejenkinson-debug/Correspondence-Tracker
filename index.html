<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Correspondence Tracker</title>
  <style>
    /* ── FT Color Palette ──────────────────────────────────────── */
    :root {
      --ft-cream:       #FFF1E5;
      --ft-cream-dark:  #F2E1D0;
      --ft-ink:         #33302E;
      --ft-claret:      #990F3D;
      --ft-teal:        #0D7680;
      --ft-sky:         #CCE6FF;
      --ft-border:      #C5B9AD;
      --ft-muted:       #77736F;
      --ft-white:       #FFFFFF;
      --ft-selected-bg: #FBE8D0;
    }

    /* ── Reset & Base ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--ft-cream);
      color: var(--ft-ink);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────────────── */
    header {
      background: var(--ft-ink);
      color: var(--ft-cream);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      border-bottom: 3px solid var(--ft-claret);
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ft-cream);
    }

    header span.tag {
      background: var(--ft-claret);
      color: var(--ft-white);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 2px;
    }

    header .count {
      margin-left: auto;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.8rem;
      color: var(--ft-border);
    }

    /* ── Search bar ───────────────────────────────────────────── */
    .search-bar {
      background: var(--ft-cream-dark);
      border-bottom: 1px solid var(--ft-border);
      padding: 8px 24px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .search-bar input {
      flex: 1;
      border: 1px solid var(--ft-border);
      background: var(--ft-white);
      color: var(--ft-ink);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.85rem;
      padding: 5px 10px;
      border-radius: 2px;
      outline: none;
    }

    .search-bar input:focus { border-color: var(--ft-teal); }

    .search-bar button {
      background: var(--ft-claret);
      color: var(--ft-white);
      border: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 5px 14px;
      border-radius: 2px;
      cursor: pointer;
    }

    .search-bar button:hover { background: #7a0c31; }

    /* ── Main two-column layout ───────────────────────────────── */
    .workspace {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ── Left panel ───────────────────────────────────────────── */
    .left-panel {
      width: 50%;
      border-right: 2px solid var(--ft-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 10px 16px 8px;
      border-bottom: 1px solid var(--ft-border);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ft-muted);
      background: var(--ft-cream);
      flex-shrink: 0;
    }

    .letter-list {
      overflow-y: auto;
      flex: 1;
    }

    /* ── Letter list item ─────────────────────────────────────── */
    .letter-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--ft-border);
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }

    .letter-item:hover { background: var(--ft-cream-dark); }

    .letter-item.active {
      background: var(--ft-selected-bg);
      border-left: 3px solid var(--ft-claret);
      padding-left: 13px;
    }

    .letter-item.active::after {
      content: '';
      position: absolute;
      right: -2px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--ft-claret);
    }

    .item-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .item-date {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ft-claret);
      white-space: nowrap;
    }

    .item-type-badge {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 2px;
      border: 1px solid;
    }

    .badge-claim      { color: var(--ft-claret); border-color: var(--ft-claret); background: #fff0f3; }
    .badge-response   { color: var(--ft-teal);   border-color: var(--ft-teal);   background: #f0fafa; }
    .badge-notice     { color: #7a4e00;           border-color: #b87800;          background: #fff8e6; }
    .badge-settlement { color: #2a5e2a;           border-color: #4a9e4a;          background: #f0f8f0; }
    .badge-general    { color: var(--ft-muted);   border-color: var(--ft-border); background: var(--ft-cream); }

    .item-parties {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--ft-ink);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-subject {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      color: var(--ft-ink);
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-themes {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .theme-tag {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.65rem;
      background: var(--ft-sky);
      color: var(--ft-teal);
      border: 1px solid #a8d4f5;
      padding: 1px 6px;
      border-radius: 10px;
      white-space: nowrap;
    }

    /* ── Right panel ──────────────────────────────────────────── */
    .right-panel {
      width: 50%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .preview-area {
      overflow-y: auto;
      flex: 1;
      padding: 24px;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--ft-muted);
      text-align: center;
      gap: 12px;
    }

    .empty-state .icon { font-size: 3rem; opacity: 0.35; }
    .empty-state p { font-family: Arial, Helvetica, sans-serif; font-size: 0.9rem; }

    /* ── Preview card ─────────────────────────────────────────── */
    .preview-card {}

    .preview-subject {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--ft-ink);
      line-height: 1.3;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--ft-claret);
      padding-bottom: 12px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 4px 10px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.82rem;
      margin-bottom: 18px;
    }

    .meta-label {
      font-weight: 700;
      color: var(--ft-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.7rem;
      padding-top: 2px;
    }

    .meta-value { color: var(--ft-ink); }

    .themes-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 20px;
    }

    .theme-pill {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      background: var(--ft-sky);
      color: var(--ft-teal);
      border: 1px solid #a8d4f5;
      padding: 3px 10px;
      border-radius: 12px;
    }

    .section-title {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ft-muted);
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--ft-border);
    }

    .letter-body {
      font-size: 0.9rem;
      line-height: 1.7;
      color: var(--ft-ink);
      white-space: pre-wrap;
      margin-bottom: 28px;
      background: var(--ft-white);
      border: 1px solid var(--ft-border);
      border-radius: 2px;
      padding: 16px 20px;
    }

    /* ── Cross-references ─────────────────────────────────────── */
    .xref-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .xref-item {
      background: var(--ft-cream-dark);
      border: 1px solid var(--ft-border);
      border-left: 3px solid var(--ft-teal);
      border-radius: 2px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .xref-item:hover { background: #e8d5c0; }

    .xref-date {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--ft-teal);
      margin-bottom: 2px;
    }

    .xref-parties {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ft-ink);
      margin-bottom: 2px;
    }

    .xref-subject {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      color: var(--ft-muted);
    }

    .xref-reason {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.7rem;
      color: var(--ft-teal);
      margin-top: 4px;
      font-style: italic;
    }

    /* ── Scrollbar styling ────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--ft-cream); }
    ::-webkit-scrollbar-thumb { background: var(--ft-border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ft-muted); }

    /* ── No-results message ───────────────────────────────────── */
    .no-results {
      padding: 24px 16px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.85rem;
      color: var(--ft-muted);
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>Correspondence Tracker</h1>
  <span class="tag">Disputes</span>
  <span class="count" id="count-label">— letters</span>
</header>

<div class="search-bar">

</div>

<div class="workspace">

        <div class="icon">✉</div>

      </div>
    </div>
  </div>
</div>

4. Your client's programme of works and any revised programmes.
5. Any insurance documentation.

Please provide these documents within 14 days.

Counterclaim
Our client disputes the alleged stage payment of £8,500. The contract provides that the stage payment is due only upon satisfactory structural completion, which has not been certified by building control. Our client therefore denies that any sum is outstanding.

Evidence
We enclose copies of the following documents for your client's review:
- Independent surveyor's report (J. Harman BSc MRICS, 12 February 2026)
- Invoices from substitute contractor (Claridge Building Services)
- Temporary accommodation receipts (17 November 2025 – 28 February 2026)

We look forward to your client's prompt response.

Yours faithfully,
Harrington & Blythe Solicitors`
  }
];

// ── Utility helpers ─────────────────────────────────────────────
function formatDate(iso) {
  const [y, m, d] = iso.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

function badgeClass(type) {
  return { claim:'badge-claim', response:'badge-response', notice:'badge-notice', settlement:'badge-settlement' }[type] || 'badge-general';
}

function badgeLabel(type) {
  return { claim:'Claim', response:'Response', notice:'Notice', settlement:'Settlement', general:'Correspondence' }[type] || type;
}

// ── Cross-reference logic ───────────────────────────────────────
const MS_PER_DAY = 24 * 60 * 60 * 1000;

/** Returns the set of significant tokens (words >3 chars) from a party name. */
function partyTokens(name) {
  return new Set(
    name.toLowerCase().split(/\s+/).filter(w => w.length > 3)
  );
}

/** True when two party names share at least one significant token. */
function partiesOverlap(a, b) {
  const ta = partyTokens(a);
  for (const token of partyTokens(b)) {
    if (ta.has(token)) return true;
  }
  return false;
}

function findRelated(letter, allLetters) {
  const related = [];
  for (const other of allLetters) {
    if (other.id === letter.id) continue;
    const reasons = [];

    // Shared parties: check both sides of each letter against each other
    const partyOverlap = [letter.from, letter.to].some(p =>
      [other.from, other.to].some(q => p && q && partiesOverlap(p, q))
    );
    if (partyOverlap) reasons.push('shared parties');

    // Shared themes (≥2)
    const sharedThemes = letter.themes.filter(t => other.themes.includes(t));
    if (sharedThemes.length >= 2) reasons.push(`themes: ${sharedThemes.slice(0,3).join(', ')}`);

    // Date proximity (within 60 days)
    const daysDiff = Math.abs(new Date(letter.date) - new Date(other.date)) / MS_PER_DAY;
    if (daysDiff <= 60) reasons.push(`${Math.round(daysDiff)}d apart`);

    if (reasons.length > 0) {
      related.push({ letter: other, reason: reasons.slice(0,2).join(' · '), score: reasons.length });
    }
  }
  related.sort((a, b) => b.score - a.score || new Date(b.letter.date) - new Date(a.letter.date));
  return related.slice(0, 5);
}

// ── State ───────────────────────────────────────────────────────
let activeId = null;
let displayedLetters = [...LETTERS].sort((a, b) => new Date(b.date) - new Date(a.date));

// ── Render list ─────────────────────────────────────────────────
function renderList(letters) {
  const container = document.getElementById('letter-list');
  document.getElementById('count-label').textContent =
    `${letters.length} letter${letters.length !== 1 ? 's' : ''}`;

  if (!letters.length) {
    container.innerHTML = '<div class="no-results">No letters match your search.</div>';
    return;
  }

  container.innerHTML = letters.map(l => `
    <div class="letter-item${l.id === activeId ? ' active' : ''}" onclick="selectLetter(${l.id})">
      <div class="item-meta">
        <span class="item-date">${formatDate(l.date)}</span>
        <span class="item-type-badge ${badgeClass(l.type)}">${badgeLabel(l.type)}</span>
      </div>
      <div class="item-parties">${escHtml(l.from)} → ${escHtml(l.to)}</div>
      <div class="item-subject">${escHtml(l.subject)}</div>
      <div class="item-themes">${l.themes.slice(0,5).map(t => `<span class="theme-tag">${escHtml(t)}</span>`).join('')}</div>
    </div>
  `).join('');
}

// ── Render preview ──────────────────────────────────────────────
function renderPreview(id) {
  const letter = LETTERS.find(l => l.id === id);
  if (!letter) return;

  const related = findRelated(letter, LETTERS);
  const relatedHtml = related.length
    ? related.map(r => `
        <div class="xref-item" onclick="selectLetter(${r.letter.id})">
          <div class="xref-date">${formatDate(r.letter.date)}</div>
          <div class="xref-parties">${escHtml(r.letter.from)} → ${escHtml(r.letter.to)}</div>
          <div class="xref-subject">${escHtml(r.letter.subject)}</div>
          <div class="xref-reason">↳ ${escHtml(r.reason)}</div>
        </div>`).join('')
    : '<p style="font-family:Arial,sans-serif;font-size:0.82rem;color:var(--ft-muted)">No cross-references found.</p>';

  document.getElementById('preview-area').innerHTML = `
    <div class="preview-card">
      <div class="preview-subject">${escHtml(letter.subject)}</div>
      <div class="meta-grid">
        <span class="meta-label">Date</span>      <span class="meta-value">${formatDate(letter.date)}</span>
        <span class="meta-label">From</span>      <span class="meta-value">${escHtml(letter.from)}</span>
        <span class="meta-label">To</span>        <span class="meta-value">${escHtml(letter.to)}</span>
        <span class="meta-label">Type</span>      <span class="meta-value"><span class="item-type-badge ${badgeClass(letter.type)}">${badgeLabel(letter.type)}</span></span>
      </div>
      <div class="section-title">Key Themes</div>
      <div class="themes-row">
        ${letter.themes.map(t => `<span class="theme-pill">${escHtml(t)}</span>`).join('')}
      </div>
      <div class="section-title">Letter Content</div>
      <div class="letter-body">${escHtml(letter.body)}</div>
      <div class="section-title">Cross-References (${related.length})</div>
      <div class="xref-list">${relatedHtml}</div>
    </div>`;
}

// ── Actions ─────────────────────────────────────────────────────
function selectLetter(id) {
  activeId = id;
  renderList(displayedLetters);
  renderPreview(id);
  // Scroll preview to top
  document.getElementById('preview-area').scrollTop = 0;
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  displayedLetters = [...LETTERS].sort((a, b) => new Date(b.date) - new Date(a.date));
  renderList(displayedLetters);
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Search ───────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', function () {
  const q = this.value.trim().toLowerCase();
  if (!q) {
    displayedLetters = [...LETTERS].sort((a, b) => new Date(b.date) - new Date(a.date));
  } else {
    displayedLetters = LETTERS.filter(l =>
      l.from.toLowerCase().includes(q) ||
      l.to.toLowerCase().includes(q) ||
      l.subject.toLowerCase().includes(q) ||
      l.themes.some(t => t.toLowerCase().includes(q)) ||
      l.body.toLowerCase().includes(q)
    ).sort((a, b) => new Date(b.date) - new Date(a.date));
  }
  renderList(displayedLetters);
});

// ── Init ─────────────────────────────────────────────────────────
renderList(displayedLetters);
</script>
</body>
</html>
